AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Weekly meetings report: built from the database on a schedule or on demand,
  saved as a CSV on S3 and emailed through SES. The builder runs in the
  backend's VPC (it needs the database) with no NAT, and reaches S3 through a
  gateway endpoint. The account is in the SES sandbox, so both the sender and
  the recipient must be verified addresses. No domain, so no DKIM records.

Parameters:
  ProjectName:
    Type: String
    Default: successfulsuccess
    Description: Prefix for the names of the resources in this stack.

  SenderEmail:
    Type: String
    AllowedPattern: "[^@\\s]+@[^@\\s]+\\.[^@\\s]+"
    ConstraintDescription: must be an email address
    Description: >-
      The address reports are sent from (REPORT_SENDER in .env). SES mails it a
      verification link when the identity is created.

  ReportRecipient:
    Type: String
    AllowedPattern: "[^@\\s]+@[^@\\s]+\\.[^@\\s]+"
    ConstraintDescription: must be an email address
    Description: >-
      Where reports go (REPORT_RECIPIENT in .env). In the sandbox it must be
      verified too; when it equals SenderEmail, that one identity covers both.

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: The backend function's VPC (`make aws-deploy-reports` reads it from the function).

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: The backend function's subnets; the builder attaches to the same ones.

  RouteTableIds:
    Type: CommaDelimitedList
    Description: >-
      Route tables of those subnets. The S3 gateway endpoint adds its route to
      each; without it the builder's PutObject hangs until the timeout.

  SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: >-
      The backend function's security group. The database only accepts 5432
      from it, so the builder uses it too.

  ImageUri:
    Type: String
    Description: >-
      Backend image, pinned by digest: <account>.dkr.ecr.<region>.amazonaws.com/<repo>@sha256:...
      The builder runs the same image with a different handler.

  DatabaseUrl:
    Type: String
    NoEcho: true
    Description: The backend function's DATABASE_URL (postgresql+asyncpg://...).

  ScheduleExpression:
    Type: String
    Default: cron(0 7 ? * MON *)
    Description: >-
      When the weekly report is built, in Europe/Kyiv time. rate(5 minutes)
      for testing; set it back afterwards.

  FailWeek:
    Type: String
    Default: ""
    AllowedPattern: "^$|^\\d{4}-W\\d{2}$"
    ConstraintDescription: must be empty or an ISO week like 2026-W01
    Description: >-
      Testing only: the builder raises for this week, so its message is retried
      and lands in the dead-letter queue. Empty in normal use.

Conditions:
  HasSeparateRecipient: !Not [!Equals [!Ref SenderEmail, !Ref ReportRecipient]]

Resources:
  # --- email ----------------------------------------------------------------

  # Creating an email identity sends a verification link to the address; it
  # stays Pending until that link is clicked.
  SenderIdentity:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: !Ref SenderEmail
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  RecipientIdentity:
    Type: AWS::SES::EmailIdentity
    Condition: HasSeparateRecipient
    Properties:
      EmailIdentity: !Ref ReportRecipient
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # --- storage --------------------------------------------------------------

  # Emptied by `make aws-destroy` before the stack goes.
  ReportsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    # S3 checks that it may invoke the mailer when the notification is set, so
    # the permission must exist first. The permission names the bucket in its
    # SourceArn; with !GetAtt ReportsBucket.Arn the two would depend on each
    # other (a circular dependency). The bucket's name is built from known
    # values instead, so the permission's ARN needs nothing from the bucket.
    DependsOn: MailerInvokePermission
    Properties:
      BucketName: !Sub "${ProjectName}-reports-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: expire-reports
            Status: Enabled
            Prefix: reports/
            ExpirationInDays: 90
      # A new report is an event; the mailer reacts to it. The builder does not
      # know the mailer exists.
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Function: !GetAtt ReportMailer.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: reports/
                  - Name: suffix
                    Value: .csv
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # Free, unlike an interface endpoint or a NAT gateway: a route to S3's prefix
  # list in each route table. Every S3 request from the VPC now takes it.
  S3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Gateway
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcId: !Ref VpcId
      RouteTableIds: !Ref RouteTableIds
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-s3"
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # --- queue ----------------------------------------------------------------

  # Messages the builder failed on three times wait here, for 14 days, instead
  # of disappearing. The console's "Start DLQ redrive" moves them back.
  ReportRequestsDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ProjectName}-report-requests-dlq"
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
      # Only the main queue may use this one as its DLQ. Its ARN is built from
      # its name: !GetAtt would be circular, since the main queue's
      # RedrivePolicy already points here.
      RedriveAllowPolicy:
        redrivePermission: byQueue
        sourceQueueArns:
          - !Sub "arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:${ProjectName}-report-requests"
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # One entry point for every report request: the schedule, `make report-now`
  # and, later, the API all send {"week": ..., "source": ...} here.
  ReportRequests:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ProjectName}-report-requests"
      # At least 6x the builder's timeout, so a message cannot become visible
      # again, and start a second builder, while the first is still running.
      VisibilityTimeout: 360
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ReportRequestsDlq.Arn
        maxReceiveCount: 3
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # --- builder --------------------------------------------------------------

  BuilderRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # Write logs, and manage the network interfaces a VPC function needs.
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: write-reports
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "arn:${AWS::Partition}:s3:::${ProjectName}-reports-${AWS::AccountId}/reports/*"
        # The Lambda service polls the queue with this role; the function itself
        # never connects to SQS, which is why it needs no NAT or SQS endpoint.
        - PolicyName: read-report-requests
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt ReportRequests.Arn
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  BuilderLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-report-builder"
      RetentionInDays: 7
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  ReportBuilder:
    Type: AWS::Lambda::Function
    # The endpoint must be routable before the first PutObject.
    DependsOn: S3Endpoint
    Properties:
      FunctionName: !Sub "${ProjectName}-report-builder"
      Description: Builds the weekly meetings report CSV and saves it to S3
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      ImageConfig:
        Command: ["app.reports.lambda_handler.handler"]
      Architectures: [x86_64]
      Role: !GetAtt BuilderRole.Arn
      MemorySize: 512
      Timeout: 60
      LoggingConfig:
        LogGroup: !Ref BuilderLogGroup
        LogFormat: JSON
      VpcConfig:
        SubnetIds: !Ref SubnetIds
        SecurityGroupIds:
          - !Ref SecurityGroupId
      Environment:
        Variables:
          # Same caveat as the API: the password is readable in the function configuration.
          DATABASE_URL: !Ref DatabaseUrl
          APP_TIMEZONE: Europe/Kyiv
          LOG_LEVEL: INFO
          REPORTS_BUCKET: !Ref ReportsBucket
          FAIL_WEEK: !Ref FailWeek
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # One message per invocation: a failure retries (and dead-letters) that one
  # report only. The mapping takes no tags here.
  ReportRequestsMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt ReportRequests.Arn
      FunctionName: !Ref ReportBuilder
      BatchSize: 1
      Enabled: true

  # --- mailer ---------------------------------------------------------------

  # Outside the VPC, so it reaches SES over the internet; it never touches the
  # database. It may read reports but never write them: a function triggered
  # by uploads to reports/ that uploads to reports/ would call itself forever.
  MailerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: read-reports-send-email
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:${AWS::Partition}:s3:::${ProjectName}-reports-${AWS::AccountId}/reports/*"
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource: !Sub "arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/*"
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  MailerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-report-mailer"
      RetentionInDays: 7
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  ReportMailer:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-report-mailer"
      Description: Emails each new weekly report CSV through SES
      Runtime: python3.12
      Handler: index.handler
      Architectures: [x86_64]
      Role: !GetAtt MailerRole.Arn
      MemorySize: 256
      Timeout: 30
      LoggingConfig:
        LogGroup: !Ref MailerLogGroup
        LogFormat: JSON
      Environment:
        Variables:
          SENDER: !Ref SenderEmail
          # Comma-separated; in the SES sandbox every address must be verified.
          RECIPIENTS: !Ref ReportRecipient
      Code:
        ZipFile: |
          """Email each new report: S3 ObjectCreated on reports/*.csv -> SES."""

          import csv
          import io
          import logging
          import os
          import posixpath
          import urllib.parse
          from email.message import EmailMessage

          import boto3

          log = logging.getLogger("meetings.mailer")
          log.setLevel(logging.INFO)
          s3 = boto3.client("s3")
          ses = boto3.client("sesv2")


          def summary_line(text):
              """One sentence from the CSV's summary section (a header row, then values)."""
              rows = list(csv.reader(io.StringIO(text)))
              start = rows.index(["section", "summary"])
              s = dict(zip(rows[start + 1], rows[start + 2]))
              return (
                  f"{s['meetings']} meetings, {s['hours']} hours. "
                  f"Previous week {s['previous_week']}: {s['previous_meetings']} meetings, "
                  f"{s['previous_hours']} hours (change {s['change_meetings']} meetings, "
                  f"{s['change_hours']} hours)."
              )


          def handler(event, context):
              sender = os.environ["SENDER"]
              recipients = [a.strip() for a in os.environ["RECIPIENTS"].split(",") if a.strip()]
              sent = []
              for record in event["Records"]:
                  bucket = record["s3"]["bucket"]["name"]
                  key = urllib.parse.unquote_plus(record["s3"]["object"]["key"])
                  log.info(
                      "report-mailer triggered",
                      extra={
                          "trigger": "s3",
                          "bucket": bucket,
                          "key": key,
                          "eventName": record["eventName"],
                          "sequencer": record["s3"]["object"].get("sequencer"),
                      },
                  )
                  data = s3.get_object(Bucket=bucket, Key=key)["Body"].read()
                  filename = posixpath.basename(key)
                  week = filename.removesuffix(".csv")

                  msg = EmailMessage()
                  msg["Subject"] = f"Weekly meetings report {week}"
                  msg["From"] = sender
                  msg["To"] = ", ".join(recipients)
                  msg.set_content(
                      f"The meetings report for {week} is attached.\n\n"
                      f"{summary_line(data.decode('utf-8'))}\n"
                  )
                  msg.add_attachment(data, maintype="text", subtype="csv", filename=filename)

                  response = ses.send_email(
                      FromEmailAddress=sender,
                      Destination={"ToAddresses": recipients},
                      Content={"Raw": {"Data": msg.as_bytes()}},
                  )
                  log.info(
                      "report emailed",
                      extra={"trigger": "s3", "key": key, "sesMessageId": response["MessageId"]},
                  )
                  sent.append({"key": key, "messageId": response["MessageId"]})
              return {"sent": sent}
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # Lets S3 invoke the mailer, for this bucket in this account only. The ARN is
  # built from the bucket's name, not !GetAtt (see ReportsBucket's DependsOn).
  MailerInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt ReportMailer.Arn
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:s3:::${ProjectName}-reports-${AWS::AccountId}"
      SourceAccount: !Ref AWS::AccountId

  # --- schedule -------------------------------------------------------------

  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: send-report-requests
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt ReportRequests.Arn
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # Schedules take no tags.
  WeeklySchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub "${ProjectName}-weekly-report"
      Description: Build last week's meetings report every Monday morning
      ScheduleExpression: !Ref ScheduleExpression
      # Without it the cron runs in UTC, and the report arrives at 9 or 10
      # o'clock Kyiv time depending on daylight saving.
      ScheduleExpressionTimezone: Europe/Kyiv
      FlexibleTimeWindow:
        Mode: "OFF"
      State: ENABLED
      # A command on the queue, not a direct invoke: retries and the DLQ come
      # with it. week null means "the week before", decided by the builder.
      Target:
        Arn: !GetAtt ReportRequests.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"week": null, "source": "schedule"}'

Outputs:
  SenderIdentity:
    Value: !Ref SenderIdentity
  RecipientIdentity:
    Value: !If [HasSeparateRecipient, !Ref RecipientIdentity, !Ref SenderIdentity]
  BucketName:
    Value: !Ref ReportsBucket
  BuilderFunctionName:
    Value: !Ref ReportBuilder
  BuilderLogGroup:
    Value: !Ref BuilderLogGroup
  QueueUrl:
    Description: Where `make report-now` sends report requests
    Value: !Ref ReportRequests
  QueueArn:
    Value: !GetAtt ReportRequests.Arn
  DlqUrl:
    Value: !Ref ReportRequestsDlq
  MailerFunctionName:
    Value: !Ref ReportMailer
