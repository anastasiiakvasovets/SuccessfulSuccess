AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Sign-in for the meetings app: a Cognito user pool where people sign up with
  their email and a password, optionally federated with Google, plus the public
  app client the Next.js frontend signs in through. The backend accepts the
  access tokens this pool issues to that client.

Parameters:
  ProjectName:
    Type: String
    Default: successfulsuccess
    Description: Prefix for the names of the resources in this stack.

  DomainPrefix:
    Type: String
    Default: ""
    Description: >-
      Prefix of Cognito's OAuth domain, https://<prefix>.auth.<region>.amazoncognito.com.
      Unique per region across all accounts, and part of the Google client's
      redirect URI. Empty uses "<ProjectName>-<account id>".

  CallbackUrls:
    Type: CommaDelimitedList
    Default: "http://localhost:3000/auth/callback/"
    Description: >-
      Where Cognito may send people back after signing in, one
      <origin>/auth/callback/ per origin the site is served from (local dev
      server and the CloudFront site). Exact match, trailing slash included.

  LogoutUrls:
    Type: CommaDelimitedList
    Default: "http://localhost:3000/"
    Description: Where Cognito may send people back after signing out, <origin>/ per origin.

  GoogleClientId:
    Type: String
    Default: ""
    Description: >-
      OAuth client id of a Google Cloud "Web application" client. Empty leaves
      Google sign-in out; email and password still work.

  GoogleClientSecret:
    Type: String
    Default: ""
    NoEcho: true
    Description: That Google client's secret.

Conditions:
  HasGoogle: !Not [!Equals [!Ref GoogleClientId, ""]]
  HasDomainPrefix: !Not [!Equals [!Ref DomainPrefix, ""]]

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${ProjectName}-users"
      # People sign in with their email address; Cognito mails them a code to
      # confirm it on sign-up and to reset a forgotten password.
      UsernameAttributes: [email]
      # Anyone may sign up on their own.
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      AutoVerifiedAttributes: [email]
      UsernameConfiguration:
        CaseSensitive: false
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
          TemporaryPasswordValidityDays: 7
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
      # Cognito's own mailer: free, but capped at 50 emails a day. Switch to SES
      # before real traffic arrives.
      EmailConfiguration:
        EmailSendingAccount: COGNITO_DEFAULT
      # Essentials is what managed login (version 2) needs; free up to 10,000
      # monthly active users.
      UserPoolTier: ESSENTIALS
      UserPoolTags:
        PROJECT_NAME: !Ref ProjectName

  # Hosts the OAuth endpoints Google sign-in goes through:
  # https://<prefix>.auth.<region>.amazoncognito.com
  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !If [HasDomainPrefix, !Ref DomainPrefix, !Sub "${ProjectName}-${AWS::AccountId}"]
      # 2 = managed login (the newer hosted pages), styled by ManagedLoginBranding.
      ManagedLoginVersion: 2

  # Cognito's default look for the managed login pages of the web client.
  ManagedLoginBranding:
    Type: AWS::Cognito::ManagedLoginBranding
    DependsOn: UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      ClientId: !Ref UserPoolClient
      UseCognitoProvidedValues: true

  GoogleIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Condition: HasGoogle
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Ref GoogleClientSecret
        authorize_scopes: openid email profile
      AttributeMapping:
        email: email
        email_verified: email_verified
        name: name
        username: sub

  # Public client for the browser: no secret, SRP for passwords (the password
  # never leaves the browser), and the authorization-code flow with PKCE for
  # Google.
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${ProjectName}-web"
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days
      # Referencing the provider (its name) also makes the client wait for it.
      SupportedIdentityProviders: !If
        - HasGoogle
        - [COGNITO, !Ref GoogleIdentityProvider]
        - [COGNITO]
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      CallbackURLs: !Ref CallbackUrls
      LogoutURLs: !Ref LogoutUrls

Outputs:
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  Issuer:
    Description: The "iss" of every token; its signing keys are at <Issuer>/.well-known/jwks.json
    Value: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
  Authority:
    Description: OIDC authority; <Authority>/.well-known/openid-configuration describes it
    Value: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
  CognitoDomain:
    Description: Cognito's OAuth domain as a URL (managed login, /logout)
    Value: !Sub "https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com"
  HostedDomain:
    Description: Cognito's OAuth domain, which the frontend sends Google sign-in through
    Value: !Sub "${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com"
  GoogleRedirectUri:
    Description: Add this to the Google client's "Authorized redirect URIs"
    Value: !Sub "https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com/oauth2/idpresponse"
  GoogleEnabled:
    Value: !If [HasGoogle, "true", "false"]
